services:
  db:
    image: postgres:15-alpine
    hostname: db
    environment:
      - POSTGRES_USER=testuser
      - POSTGRES_PASSWORD=testpass
      - POSTGRES_DB=testdb
    ports:
      - "5432" # The internal port
    healthcheck:
      # Use the pg_isready utility to check if the server is accepting connections
      test: ["CMD-SHELL", "pg_isready -U testuser -d testdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  # A simple web server service
  web:
    image: nginx:1.27-alpine
    hostname: web
    ports:
      - "80" # The internal port
    depends_on:
      db:
        condition: service_healthy # Nginx will only start after the DB is healthy
